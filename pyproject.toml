[project]
name = "audit-llm"
version = "0.1.0"
description = "Аудит локальных LLM: проверка целостности файлов моделей"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
auditllm = "auditllm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auditllm*"]
